[project]
name = "ats-backend"
version = "0.1.0"
description = "AI recruitment and job matching backend"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.11",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.35",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "pydantic-extra-types[pycountry]>=2.9",
    "anthropic>=2.3.0",
    "pymupdf>=2.0",
    "rapidfuzz>=3.14.6",
    "python-multipart>=0.0.32",
    "pgvector>=0.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Maps typographic punctuation on purpose.
"eval/render.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^migrations/"]

[[tool.mypy.overrides]]
# PyMuPDF ships without type hints.
module = ["app.ingestion.pdf", "tests.conftest", "eval.render"]
disallow_untyped_calls = false
